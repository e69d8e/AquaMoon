name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # Android Build (APK & AAB)
  # ==========================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # Restores the release keystore from repository secrets and writes the
      # android/key.properties that android/app/build.gradle.kts consumes.
      # Without these the Gradle build silently falls back to DEBUG signing,
      # so this step fails loudly when a secret is missing.
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is not configured; refusing to publish an unsigned release."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/aquamoon-release.jks
          test -s android/app/aquamoon-release.jks

          # storeFile is resolved relative to the android/ directory.
          cat > android/key.properties <<EOF
          storeFile=app/aquamoon-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 android/app/aquamoon-release.jks android/key.properties
          echo "Release signing material prepared."

      - name: Build APK (Split ABI & Universal) & AppBundle
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release

      # Guards against the debug-signing fallback silently reaching users.
      - name: Verify APK is signed with the AquaMoon release certificate
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          echo "Using: $APKSIGNER"
          CERT_INFO="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$CERT_INFO"
          EXPECTED_FINGERPRINT="5346d1f673b61d25a6431e26bc8f41dd5066ff83a1a363c692ad79abcf55c13d"
          if ! printf '%s' "$CERT_INFO" | tr 'A-F' 'a-f' | grep -q "$EXPECTED_FINGERPRINT"; then
            echo "::error::APK is NOT signed with the AquaMoon release certificate."
            exit 1
          fi
          echo "APK signature verified against the AquaMoon release certificate."

      - name: Collect Android Artifacts
        run: |
          mkdir -p release-android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-android/AquaMoon-Android-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-android/AquaMoon-Android-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-android/AquaMoon-Android-x86_64.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk release-android/AquaMoon-Android-Universal.apk || true
          cp build/app/outputs/bundle/release/app-release.aab release-android/AquaMoon-Android.aab || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-android/*

  # ==========================================
  # Publish to GitHub Releases
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Final Release Directory
        run: |
          mkdir -p final-release
          find all-artifacts -type f -exec cp {} final-release/ \;
          echo "=== Artifacts ready for release ==="
          ls -lh final-release

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
