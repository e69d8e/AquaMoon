name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Android Build
  # ==========================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build APK (Split ABI & Universal) & AppBundle
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release

      - name: Collect Android Artifacts
        run: |
          mkdir -p release-android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-android/AquaMoon-Android-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-android/AquaMoon-Android-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-android/AquaMoon-Android-x86_64.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk release-android/AquaMoon-Android-Universal.apk || true
          cp build/app/outputs/bundle/release/app-release.aab release-android/AquaMoon-Android.aab || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-android/*

  # ==========================================
  # 2. macOS Build
  # ==========================================
  build-macos:
    name: Build macOS (.app ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Package macOS Artifact
        run: |
          mkdir -p release-macos
          cd build/macos/Build/Products/Release
          zip -r -y "${GITHUB_WORKSPACE}/release-macos/AquaMoon-macOS.zip" *.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-macos/*

  # ==========================================
  # 3. Windows Build
  # ==========================================
  build-windows:
    name: Build Windows (ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release-windows\AquaMoon-Windows-x64.zip"
          } elseif (Test-Path "build\windows\runner\Release") {
            Compress-Archive -Path "build\windows\runner\Release\*" -DestinationPath "release-windows\AquaMoon-Windows-x64.zip"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-windows/*

  # ==========================================
  # 4. Linux Build
  # ==========================================
  build-linux:
    name: Build Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux Artifact
        run: |
          mkdir -p release-linux
          if [ -d "build/linux/x64/release/bundle" ]; then
            tar -czvf release-linux/AquaMoon-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
          elif [ -d "build/linux/release/bundle" ]; then
            tar -czvf release-linux/AquaMoon-Linux-x64.tar.gz -C build/linux/release/bundle .
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-linux/*

  # ==========================================
  # 5. Web Build
  # ==========================================
  build-web:
    name: Build Web (ZIP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release

      - name: Package Web Artifact
        run: |
          mkdir -p release-web
          cd build/web && zip -r "${GITHUB_WORKSPACE}/release-web/AquaMoon-Web.zip" .

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: release-web/*

  # ==========================================
  # 6. Publish to GitHub Releases
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows, build-linux, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Final Release Directory
        run: |
          mkdir -p final-release
          find all-artifacts -type f -exec cp {} final-release/ \;
          echo "=== Artifacts ready for release ==="
          ls -lh final-release

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
