name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # Android Build (APK only)
  # ==========================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 固定在开发/验证所用版本：新版 stable 要求 material_ui 迁移与
          # AGP 9.1.1，升级单独跟进，避免发布流水线随上游漂移而失败。
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # Restores the release keystore from repository secrets and writes the
      # android/key.properties that android/app/build.gradle.kts consumes.
      # Without these the Gradle build silently falls back to DEBUG signing,
      # so this step fails loudly when a secret is missing.
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is not configured; refusing to publish an unsigned release."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/aquamoon-release.jks
          test -s android/app/aquamoon-release.jks

          # storeFile is resolved relative to the android/ directory.
          cat > android/key.properties <<EOF
          storeFile=app/aquamoon-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 android/app/aquamoon-release.jks android/key.properties
          echo "Release signing material prepared."

      # Only the two ARM split APKs and the Universal (all-ABI) APK are built.
      - name: Build APKs (arm64-v8a, armeabi-v7a, Universal)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          flutter build apk --release

      # Guards against the debug-signing fallback silently reaching users.
      - name: Verify APKs are signed with the AquaMoon release certificate
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          echo "Using: $APKSIGNER"
          EXPECTED_FINGERPRINT="5346d1f673b61d25a6431e26bc8f41dd5066ff83a1a363c692ad79abcf55c13d"
          for apk in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-release.apk; do
            test -f "$apk"
            CERT_INFO="$("$APKSIGNER" verify --print-certs "$apk")"
            echo "== $apk"
            echo "$CERT_INFO"
            if ! printf '%s' "$CERT_INFO" | tr 'A-F' 'a-f' | grep -q "$EXPECTED_FINGERPRINT"; then
              echo "::error::$apk is NOT signed with the AquaMoon release certificate."
              exit 1
            fi
          done
          echo "APK signatures verified against the AquaMoon release certificate."

      - name: Collect Android Artifacts
        run: |
          set -euo pipefail
          mkdir -p release-android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-android/AquaMoon-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-android/AquaMoon-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-android/AquaMoon-Android-Universal.apk
          ls -lh release-android

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-android/*

  # ==========================================
  # Publish to GitHub Releases
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Final Release Directory
        run: |
          mkdir -p final-release
          find all-artifacts -type f -exec cp {} final-release/ \;
          echo "=== Artifacts ready for release ==="
          ls -lh final-release

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: 水月音 ${{ github.ref_name }}
          files: final-release/*
          generate_release_notes: true
          draft: false
          prerelease: false