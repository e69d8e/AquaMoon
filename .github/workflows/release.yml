name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Android Build (APK & AAB)
  # ==========================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build APK (Split ABI & Universal) & AppBundle
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release

      - name: Collect Android Artifacts
        run: |
          mkdir -p release-android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-android/AquaMoon-Android-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-android/AquaMoon-Android-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-android/AquaMoon-Android-x86_64.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk release-android/AquaMoon-Android-Universal.apk || true
          cp build/app/outputs/bundle/release/app-release.aab release-android/AquaMoon-Android.aab || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-android/*

  # ==========================================
  # 2. iOS Build (Unsigned IPA)
  # ==========================================
  build-ios:
    name: Build iOS (Unsigned IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application (No Code Sign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p release-ios/Payload
          cp -r build/ios/iphoneos/Runner.app release-ios/Payload/
          cd release-ios
          zip -r -y AquaMoon-iOS-Unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-ios/*

  # ==========================================
  # 3. macOS Build (DMG & ZIP)
  # ==========================================
  build-macos:
    name: Build macOS (DMG & ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Package macOS Artifacts (DMG & ZIP)
        run: |
          mkdir -p release-macos
          
          # 1. ZIP bundle
          cd build/macos/Build/Products/Release
          zip -r -y "${GITHUB_WORKSPACE}/release-macos/AquaMoon-macOS.zip" *.app
          cd "${GITHUB_WORKSPACE}"

          # 2. DMG disk image with Applications shortcut
          mkdir -p dmg_temp
          cp -r build/macos/Build/Products/Release/*.app dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "AquaMoon" -srcfolder dmg_temp -ov -format UDZO "${GITHUB_WORKSPACE}/release-macos/AquaMoon-macOS.dmg"
          rm -rf dmg_temp

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-macos/*

  # ==========================================
  # 4. Windows Build (Installer EXE & Portable ZIP)
  # ==========================================
  build-windows:
    name: Build Windows (Installer EXE & ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Artifacts (Installer EXE & Portable ZIP)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows
          
          # 1. Portable ZIP
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release-windows\AquaMoon-Windows-x64-Portable.zip"
          } elseif (Test-Path "build\windows\runner\Release") {
            Compress-Archive -Path "build\windows\runner\Release\*" -DestinationPath "release-windows\AquaMoon-Windows-x64-Portable.zip"
          }

          # 2. Installer EXE (Inno Setup)
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\installer.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-windows/*

  # ==========================================
  # 5. Linux Build (DEB & tar.gz)
  # ==========================================
  build-linux:
    name: Build Linux (DEB & tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux Artifacts (DEB & tar.gz)
        run: |
          mkdir -p release-linux
          
          # 1. Portable tar.gz
          if [ -d "build/linux/x64/release/bundle" ]; then
            tar -czvf release-linux/AquaMoon-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
          elif [ -d "build/linux/release/bundle" ]; then
            tar -czvf release-linux/AquaMoon-Linux-x64.tar.gz -C build/linux/release/bundle .
          fi

          # 2. Debian .deb package
          mkdir -p deb_root/DEBIAN
          mkdir -p deb_root/opt/aquamoon
          mkdir -p deb_root/usr/share/applications
          mkdir -p deb_root/usr/share/pixmaps
          mkdir -p deb_root/usr/bin

          if [ -d "build/linux/x64/release/bundle" ]; then
            cp -r build/linux/x64/release/bundle/* deb_root/opt/aquamoon/
          elif [ -d "build/linux/release/bundle" ]; then
            cp -r build/linux/release/bundle/* deb_root/opt/aquamoon/
          fi
          
          cp assets/icons/app_icon.png deb_root/usr/share/pixmaps/aquamoon.png

          printf "[Desktop Entry]\nName=AquaMoon\nComment=水墨禅意跨平台现代音乐播放器\nExec=/usr/bin/aquamoon\nIcon=aquamoon\nTerminal=false\nType=Application\nCategories=AudioVideo;Audio;Player;Music;\n" > deb_root/usr/share/applications/aquamoon.desktop

          printf "#!/bin/bash\nexec /opt/aquamoon/aquamoon \"\$@\"\n" > deb_root/usr/bin/aquamoon
          chmod +x deb_root/usr/bin/aquamoon

          printf "Package: aquamoon\nVersion: 1.0.0\nSection: sound\nPriority: optional\nArchitecture: amd64\nMaintainer: AquaMoon Authors <https://github.com/e69d8e/AquaMoon>\nDescription: AquaMoon - Zen ink modern music player\n A modern, cross-platform music player blending Zen ink aesthetics with an industrial-grade audio core.\n" > deb_root/DEBIAN/control

          dpkg-deb --build deb_root release-linux/AquaMoon-Linux-x64.deb
          rm -rf deb_root

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-linux/*

  # ==========================================
  # 6. Web Build (ZIP)
  # ==========================================
  build-web:
    name: Build Web (ZIP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --release

      - name: Package Web Artifact
        run: |
          mkdir -p release-web
          cd build/web && zip -r "${GITHUB_WORKSPACE}/release-web/AquaMoon-Web.zip" .

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: release-web/*

  # ==========================================
  # 7. Publish to GitHub Releases
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios, build-macos, build-windows, build-linux, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Final Release Directory
        run: |
          mkdir -p final-release
          find all-artifacts -type f -exec cp {} final-release/ \;
          echo "=== Artifacts ready for release ==="
          ls -lh final-release

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
